name: Sécurité des villes (Ma ville)

on:
  schedule:
    # Une fois par mois : le SSMSI publie ses chiffres communaux une fois par an (juillet).
    # Le script ne réécrit un fichier que si son contenu a changé : un mois sans nouveauté ne produit aucun commit.
    - cron: '17 5 8 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: donnees-securite
  cancel-in-progress: false

jobs:
  securite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Construire les chiffres de sécurité
        run: python construire_securite.py
      - name: Committer les données mises à jour
        run: |
          git config user.name bot-ingestion
          git config user.email bot@example.invalid
          git add data/securite/
          if git diff --cached --quiet; then
            echo 'Aucune donnee modifiee.'
            exit 0
          fi
          git commit -m 'Securite des villes du '$(date -u +%F)
          # Plusieurs workflows commitent sur main independamment : on
          # retente en cas de collision plutot que d'echouer d'un coup.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
