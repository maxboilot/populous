name: Données des villes (Ma ville)

on:
  schedule:
    # Une fois par mois : l'OFGL ne met à jour ses comptes que quelques fois
    # par an (les comptes d'une année sont provisoires jusqu'à fin décembre de
    # l'année suivante). Le script ne réécrit un fichier que si son contenu a
    # changé, donc un mois sans nouveauté ne produit aucun commit.
    - cron: '41 4 2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: donnees-villes
  cancel-in-progress: false

jobs:
  villes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Construire les données des 100 plus grandes villes
        run: python construire_villes.py
      - name: Committer les données mises à jour
        run: |
          git config user.name bot-ingestion
          git config user.email bot@example.invalid
          git add data/villes/
          if git diff --cached --quiet; then
            echo 'Aucune donnee modifiee.'
            exit 0
          fi
          git commit -m 'Donnees des villes du '$(date -u +%F)
          # Plusieurs workflows commitent sur main independamment : on
          # retente en cas de collision plutot que d'echouer d'un coup.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
