name: Suivi Instagram

# Un instantane par jour (abonnes + performance des posts) dans data/suivi_instagram.json. LECTURE SEULE : aucune publication.
# Bilan : python3 suivi_instagram.py --bilan
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suivi-instagram
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Releve du jour
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python suivi_instagram.py
      - name: Committer le releve
        run: |
          git config user.name bot-suivi
          git config user.email bot@example.invalid
          git add data/suivi_instagram.json
          if git diff --cached --quiet; then echo 'Rien de nouveau.'; exit 0; fi
          git commit -m 'Suivi Instagram du '$(date -u +%F)
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
