name: Votes des conseils municipaux

on:
  schedule:
    # Une fois par semaine : les villes branchées publient leurs délibérations
    # après chaque séance (une dizaine par an). Le script ne réécrit un fichier
    # que si son contenu a changé, donc une semaine sans séance ne produit
    # aucun commit. Une source en panne n'efface jamais les données publiées.
    - cron: '29 6 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: votes-conseils
  cancel-in-progress: false

jobs:
  votes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Construire les votes des conseils
        run: python construire_votes_conseils.py
      - name: Committer les données mises à jour
        run: |
          git config user.name bot-ingestion
          git config user.email bot@example.invalid
          git add data/votes/
          if git diff --cached --quiet; then
            echo 'Aucune donnee modifiee.'
            exit 0
          fi
          git commit -m 'Votes des conseils du '$(date -u +%F)
          # Plusieurs workflows commitent sur main independamment : on
          # retente en cas de collision plutot que d'echouer d'un coup.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
