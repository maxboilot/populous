name: Ingestion quotidienne des scrutins

on:
  schedule:
    # GitHub ne garantit pas l'heure d'une tâche planifiée : elle est mise en
    # file d'attente selon la charge, et le début de chaque heure est le pire
    # moment — on s'écarte donc de l'heure pile. Plus grave : GitHub peut
    # carrément sauter une exécution planifiée en cas de forte charge, pas
    # seulement la retarder (documenté par GitHub lui-même). Constaté le
    # 9 septembre 2026 : les deux premiers créneaux du matin n'ont jamais
    # tourné, laissant l'agenda affiché comme périmé plusieurs heures. Huit
    # créneaux répartis sur la journée plutôt que quatre le matin seulement,
    # pour qu'un ou deux ratés d'affilée restent sans conséquence visible.
    # Le script est idempotent : une exécution qui ne trouve rien ne coûte
    # rien et ne commite pas.
    - cron: '23 2 * * *'
    - cron: '23 5 * * *'
    - cron: '23 8 * * *'
    - cron: '23 11 * * *'
    - cron: '23 14 * * *'
    - cron: '23 17 * * *'
    - cron: '23 20 * * *'
    - cron: '23 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Deux exécutions retardées pourraient se chevaucher et se disputer le push.
# On les met à la queue leu leu au lieu de les laisser entrer en collision.
concurrency:
  group: ingestion-scrutins
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Exécuter l'ingestion
        run: python ingest_scrutins.py
      - name: Construire l historique des lois
        run: python construire_historique.py
      - name: Construire le bilan de vote par groupe et par theme
        run: python construire_groupes_themes.py
      - name: Construire l agenda a venir
        run: python construire_agenda.py
      - name: Committer les données mises à jour
        run: |
          git config user.name bot-ingestion
          git config user.email bot@example.invalid
          git add data/
          if git diff --cached --quiet; then
            echo 'Aucune donnee modifiee.'
            exit 0
          fi
          if python3 verif_changement_utile.py; then
            echo 'Seul l horodatage a change : pas de commit.'
            exit 0
          fi
          git commit -m 'Donnees du '$(date -u +%F)
          # Plusieurs workflows commitent sur main independamment : on
          # retente en cas de collision plutot que d'echouer d'un coup.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
