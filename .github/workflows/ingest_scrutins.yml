name: Ingestion quotidienne des scrutins

on:
  schedule:
    # 6h05 heure de Paris pendant l'heure d'été (5h05 UTC) — ajuste
    # selon la saison, ou lance simplement deux fois pour couvrir les deux.
    - cron: "5 5 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour tester manuellement

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Exécuter l'ingestion
        run: python ingest_scrutins.py

      - name: Committer les données mises à jour
        run: |
          git config user.name "bot-ingestion"
          git config user.email "bot@example.invalid"
          git add data/
          git diff --cached --quiet && echo "rien de neuf aujourd'hui" || \
            git commit -m "Données du $(date -u +%F)"
          git push
