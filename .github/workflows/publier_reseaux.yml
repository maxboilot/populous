name: Publication réseaux sociaux

on:
  # Le déclenchement se fait à l'heure exacte par le Worker Cloudflare
  # (planificateur/), via workflow_dispatch : les crons de GitHub ont 1 à 9 h de retard.
  # Seul le type « loi » garde un cron GitHub, comme filet de sécurité si le Worker est
  # indisponible : sans danger, il n'y a jamais de doublon (état lois_publiees, voir
  # publier_reseaux.py) et il ne fait rien quand il n'y a pas de nouveau texte voté.
  schedule:
    - cron: '37 9 * * *'
    - cron: '37 15 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: "Type de contenu (fait, presidentiel, depute, avenir, boussole, loi, reel, vote)"
        required: true
        default: fait
      # Uniquement pour type=vote (lance a la main, jamais par le planificateur) :
      numero:
        description: "(vote) numero du scrutin"
        required: false
      titre:
        description: "(vote) titre synthetique, relu par un humain"
        required: false
      resume:
        description: "(vote) extrait de l'expose des motifs, relu par un humain (ajoute une 2e image au diaporama) ; vide = image seule"
        required: false
      source_resume:
        description: "(vote) source du resume, ex. exposé des motifs de la proposition de loi n°3106"
        required: false
      publier:
        description: "(vote) true = publier ; false = brouillon (images en artefact du run)"
        required: false
        default: "false"
      plateformes:
        description: "Ou publier : facebook,instagram (defaut) | instagram | facebook. Sert a rattraper une plateforme sans doubler l'autre."
        required: false
        default: "facebook,instagram"

permissions:
  contents: write

concurrency:
  group: publier-reseaux
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-24.04
    # Le rendu des 5 slides + de l'apercu prend quelques minutes (HyperFrames, Chrome sans GPU) ; au-dela, c'est un blocage.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances
        run: |
          pip install requests Pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verifier l'environnement de rendu (HyperFrames)
        # Informatif : la ligne montre ce que HyperFrames voit (Chrome, FFmpeg). Ne bloque jamais.
        run: npx --yes hyperframes@0.8.222 doctor || true
      - name: Determiner le type de contenu pour ce declenchement
        id: type
        run: |
          case "${{ github.event.schedule }}" in
            '7 5 * * *')    echo "type=fait" >> "$GITHUB_OUTPUT" ;;
            '13 10 * * *')  echo "type=presidentiel" >> "$GITHUB_OUTPUT" ;;
            '22 12 * * *')  echo "type=depute" >> "$GITHUB_OUTPUT" ;;
            '38 17 * * 1')  echo "type=avenir" >> "$GITHUB_OUTPUT" ;;
            '51 19 15 * *') echo "type=boussole" >> "$GITHUB_OUTPUT" ;;
            '37 9 * * *'|'37 15 * * *') echo "type=loi" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=${{ github.event.inputs.type }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Dechiffrer l'instru des Reels
        # Le depot est public : seule la version chiffree de l'instru (instru2.mp3.enc) y est versionnee.
        # La cle est le secret INSTRU_CLE. Sans cle ou en cas d'echec, les Reels gardent la bande son synthetisee.
        env:
          INSTRU_CLE: ${{ secrets.INSTRU_CLE }}
        run: |
          D=carrousels/moteur/reel/assets/audio
          if [ -z "$INSTRU_CLE" ]; then echo "Pas de cle INSTRU_CLE : bande son synthetisee."; exit 0; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$D/instru2.mp3.enc" -out "$D/instru2.mp3" -pass env:INSTRU_CLE \
            && echo "Instru dechiffre." || { echo "Dechiffrement impossible : bande son synthetisee."; rm -f "$D/instru2.mp3"; }
      - name: Publier
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TYPE: ${{ steps.type.outputs.type }}
          # Entrees saisies par un humain : passees par variables d'environnement,
          # jamais interpolees dans le script shell (injection de commande).
          INPUT_NUMERO: ${{ github.event.inputs.numero }}
          INPUT_TITRE: ${{ github.event.inputs.titre }}
          INPUT_RESUME: ${{ github.event.inputs.resume }}
          INPUT_SOURCE_RESUME: ${{ github.event.inputs.source_resume }}
          INPUT_PUBLIER: ${{ github.event.inputs.publier }}
          INPUT_PLATEFORMES: ${{ github.event.inputs.plateformes }}
        run: |
          if [ "$TYPE" = "vote" ]; then
            ARGS=(--type vote --numero "$INPUT_NUMERO" --titre "$INPUT_TITRE")
            if [ -n "$INPUT_RESUME" ]; then ARGS+=(--resume "$INPUT_RESUME" --source-resume "$INPUT_SOURCE_RESUME"); fi
            if [ "$INPUT_PUBLIER" = "true" ]; then ARGS+=(--publier --plateformes "${INPUT_PLATEFORMES:-facebook,instagram}"); fi
            python publier_reseaux.py "${ARGS[@]}"
          else
            python publier_reseaux.py --type "$TYPE" --publier --plateformes "${INPUT_PLATEFORMES:-facebook,instagram}"
          fi
      - name: Joindre le carrousel genere (brouillon a relire / aide au diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrousel-${{ steps.type.outputs.type }}
          path: |
            assets_social/carrousels/**
            assets_social/reels/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Committer l'etat de publication mis a jour
        # Necessaire depuis que contenu_presidentielle() se souvient du
        # dernier sondage poste (data/state_publication.json) pour ne pas
        # reposter le meme sondage chaque jour : sans ce commit, l'etat
        # ecrit sur le runner serait perdu au prochain declenchement, qui
        # repart d'un checkout propre. Meme logique que
        # ingest_scrutins.yml (plusieurs workflows commitent sur main
        # independamment : on retente en cas de collision).
        run: |
          git config user.name bot-publication
          git config user.email bot@example.invalid
          # N'existe que si contenu_presidentielle() a deja poste un sondage
          # au moins une fois (cf. lire_etat_publication/ecrire_etat_publication
          # dans publier_reseaux.py) — absent pour tout autre type de
          # contenu, "git add" planterait sinon avec "pathspec ... did not
          # match any files".
          if [ -f data/state_publication.json ]; then
            git add data/state_publication.json
          fi
          if git diff --cached --quiet; then
            echo 'Aucun etat a committer.'
            exit 0
          fi
          git commit -m 'Etat de publication du '$(date -u +%F)
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
