name: Publication réseaux sociaux

on:
  schedule:
    # Heures Paris (CEST, UTC+2 — comme actuellement en septembre ; a
    # decaler d'une heure a l'entree en heure d'hiver fin octobre, meme
    # limite que les autres workflows planifies de ce depot qui ne
    # geolocalisent pas non plus leurs horaires).
    #
    # Minutes volontairement decalees des heures rondes (:07, :13, :22...)
    # plutot que :00 — GitHub documente que les crons pile a l'heure ronde
    # subissent plus de retard, tout le monde les utilisant. Ca n'elimine
    # pas les delais constates (2-5h observes les 15-16/09), juste une
    # attenuation en attendant mieux (cf. strategie de declenchement externe
    # via workflow_dispatch, evoquee avec Max le 16/09).
    - cron: '7 5 * * *'     # 07:07 Paris — fait du jour (quotidien)
    - cron: '13 10 * * *'   # 12:13 Paris — actu presidentielle (quotidien)
    - cron: '22 12 * * *'   # 14:22 Paris — depute du jour (quotidien)
    - cron: '38 17 * * 1'   # 19:38 Paris, le lundi — a venir a l'Assemblee (hebdomadaire)
    - cron: '51 19 15 * *'  # 21:51 Paris, le 15 du mois — boussole politique (mensuel)
  workflow_dispatch:
    inputs:
      type:
        description: "Type de contenu (fait, presidentiel, depute, avenir, boussole)"
        required: true
        default: fait

permissions:
  contents: write

concurrency:
  group: publier-reseaux
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: pip install requests Pillow
      - name: Determiner le type de contenu pour ce declenchement
        id: type
        run: |
          case "${{ github.event.schedule }}" in
            '7 5 * * *')    echo "type=fait" >> "$GITHUB_OUTPUT" ;;
            '13 10 * * *')  echo "type=presidentiel" >> "$GITHUB_OUTPUT" ;;
            '22 12 * * *')  echo "type=depute" >> "$GITHUB_OUTPUT" ;;
            '38 17 * * 1')  echo "type=avenir" >> "$GITHUB_OUTPUT" ;;
            '51 19 15 * *') echo "type=boussole" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=${{ github.event.inputs.type }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Publier
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publier_reseaux.py --type ${{ steps.type.outputs.type }} --publier
      - name: Committer l'etat de publication mis a jour
        # Necessaire depuis que contenu_presidentielle() se souvient du
        # dernier sondage poste (data/state_publication.json) pour ne pas
        # reposter le meme sondage chaque jour : sans ce commit, l'etat
        # ecrit sur le runner serait perdu au prochain declenchement, qui
        # repart d'un checkout propre. Meme logique que
        # ingest_scrutins.yml (plusieurs workflows commitent sur main
        # independamment : on retente en cas de collision).
        run: |
          git config user.name bot-publication
          git config user.email bot@example.invalid
          git add data/state_publication.json
          if git diff --cached --quiet; then
            echo 'Aucun etat a committer.'
            exit 0
          fi
          git commit -m 'Etat de publication du '$(date -u +%F)
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
