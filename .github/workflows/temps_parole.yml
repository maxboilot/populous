name: Temps de parole Présidentielle 2027

on:
  schedule:
    # Une fois par semaine : l'Arcom ne publie qu'un mois à la fois, avec
    # plusieurs mois de retard. Le script est idempotent : sans nouveau mois
    # publié, rien n'est commité.
    - cron: '23 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: temps-parole-presidentielle
  cancel-in-progress: false

jobs:
  temps-parole:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire les temps de parole
        run: python construire_temps_parole.py
      - name: Committer les données mises à jour
        run: |
          git config user.name bot-ingestion
          git config user.email bot@example.invalid
          git add data/temps_parole.json
          if git diff --cached --quiet; then
            echo 'Aucune donnee modifiee.'
            exit 0
          fi
          if python3 verif_changement_utile.py; then
            echo 'Seul l horodatage a change : pas de commit.'
            exit 0
          fi
          git commit -m 'Temps de parole presidentielle du '$(date -u +%F)
          # Plusieurs workflows commitent sur main independamment : on
          # retente en cas de collision plutot que d'echouer d'un coup.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push echoue (tentative $i/5), nouvel essai..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "Echec apres 5 tentatives."
          exit 1
